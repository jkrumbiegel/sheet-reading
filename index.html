<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheet Reading Trainer</title>
  </head>
  <body>
    <main>
      <h1>Sheet Reading Trainer</h1>

      <section id="stage">
        <div id="staff"></div>
        <div id="streak" title="Current streak / best">
          <span id="streak-current">0</span>
          <span id="streak-best">best 0</span>
        </div>
      </section>

      <div id="piano"></div>

      <section id="controls">
        <label>
          Key
          <select id="key"></select>
        </label>

        <label class="check">
          <input type="checkbox" id="accidentals" />
          Include sharps / flats
        </label>

        <label>
          Min jump (semitones): <output id="minIntervalOut"></output>
          <input type="range" id="minInterval" min="1" max="12" />
        </label>

        <label>
          Keyboard base octave
          <input type="number" id="baseOctave" min="1" max="7" />
        </label>

        <label class="check">
          <input type="checkbox" id="ignoreOctave" />
          Ignore octave (match pitch class only)
        </label>
      </section>

      <p id="midi-status" class="status"></p>
      <p class="hint">
        Computer keyboard: A S D F G H J K = C D E F G A B C, with W E T Y U for
        the black keys. Or play your MIDI keyboard.
      </p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
